[project]
name = "mini-gpt"
version = "0.1.0"
description = "PyTorch로 처음부터 구현하는 소형 GPT (블로그 연재: LLM(SLM) 만들어보기)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
